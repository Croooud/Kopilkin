name: Deploy to Telegram

# Каждый push в main собирает приложение и выкладывает бота и Mini App в Telegram Serverless.
# Нужен секрет репозитория TGCLOUD_TOKEN (@BotFather → бот → Serverless → CLI Access).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: telegram-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build dist/index.html
        run: npm run build

      - name: Push to Telegram Serverless
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: |
          if [ -z "$TGCLOUD_TOKEN" ]; then
            echo "::warning::Нет секрета TGCLOUD_TOKEN — деплой пропущен. Добавьте его в Settings → Secrets and variables → Actions."
            exit 0
          fi
          npx tgcloud push
          npx tgcloud migrate --safe
          npx tgcloud status
